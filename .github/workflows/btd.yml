name: build test deploy
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: building the code
        run: echo "the code is ready to be tested"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: test code
        run: echo "the code is tested and everything is working fine"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: deploy code
        run: echo "the code is deployed"
    
